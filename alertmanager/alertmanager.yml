route:
  receiver: default
  group_by: [alertname, consumergroup]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

# A dead broker makes every consumer alert meaningless, and an empty group makes
# "stuck" and "slow" meaningless for that group. Keep only the root cause.
inhibit_rules:
  - source_matchers: [alertname =~ "KafkaBrokerMetricsMissing|KafkaExporterDown"]
    target_matchers: [alertname =~ "KafkaConsumer.*"]
  - source_matchers: [alertname = "KafkaConsumerGroupNoMembers"]
    target_matchers: [alertname =~ "KafkaConsumerStuck|KafkaConsumerLagGrowing"]
    equal: [consumergroup]

# Alerts are only visible in the Alertmanager UI. A real receiver (email, webhook,
# Telegram) is left out on purpose: no secrets in the repo.
receivers:
  - name: default
