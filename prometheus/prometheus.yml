global:
  scrape_interval: 5s       # short so the demo reacts in seconds; 15s-30s is fine for real clusters
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # consumer groups, offsets, lag: the exporter talks to the broker as a client
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  # broker internals through the JMX java agent inside the broker process
  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka:7071"]
